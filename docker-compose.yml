services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitch_graders
      POSTGRES_USER: glitch
      POSTGRES_PASSWORD: glitch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitch -d glitch_graders"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glitch:glitch@postgres:5432/glitch_graders?schema=public
      SESSION_SECRET: replace-this-before-production
      APP_URL: http://localhost:3000
      ADMIN_AUTH_CODE: replace-this-before-production
    ports:
      - "3000:3000"

volumes:
  postgres-data:
